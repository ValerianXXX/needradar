name: portfolio-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check

